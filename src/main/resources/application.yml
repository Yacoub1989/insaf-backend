server:
  port: ${PORT:8888}
spring:
  application:
    name: insaf-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/insaf_finance?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:insaf_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
