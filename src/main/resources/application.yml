server:
  port: ${SERVER_PORT:${PORT:5000}}
  address: 0.0.0.0
spring:
  application:
    name: insaf-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://cmc-database.cbo2fkkaanyx.eu-north-1.rds.amazonaws.com:3306/insaf_database?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:insaf_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  database-auth:
    enabled: ${INSAF_DATABASE_AUTH_ENABLED:false}

  paiements:
    simulation: ${INSAF_PAIEMENTS_SIMULATION:false}
    autoriser-rds-test: ${INSAF_AUTORISER_RDS_TEST:false}
